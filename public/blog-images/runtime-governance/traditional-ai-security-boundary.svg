
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Traditional AI Security Looks at the Model">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(33, 28, 22, 0.16)"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D8CDBE"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E07A1F"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F6F1E8"/>
  
    
    <text x="800" y="50.62" text-anchor="middle" fill="#1E1A17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" style="">
      <tspan x="800" dy="0">Traditional AI Security</tspan><tspan x="800" dy="70.76">Looks at the Model</tspan>
    </text>
    <rect x="660" y="118" width="280" height="8" rx="4" fill="#E07A1F"/>
  
    <rect x="70" y="160" width="1460" height="600" rx="34" fill="#FFFDF9" stroke="#D8CDBE" stroke-width="2" filter="url(#shadow)"/>
    <line x1="245" y1="360" x2="320" y2="360" stroke="#D8CDBE" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <line x1="500" y1="360" x2="610" y2="360" stroke="#D8CDBE" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <line x1="850" y1="360" x2="924" y2="360" stroke="#E07A1F" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowAccent)"/>
    <line x1="1284" y1="360" x2="1360" y2="360" stroke="#D8CDBE" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

    
    <g filter="url(#shadow)">
      <rect x="120" y="300" width="150" height="120" rx="26" fill="#FFFDF9" stroke="#D8CDBE" stroke-width="2"/>
    </g>
    
    <text x="195" y="370" text-anchor="middle" fill="#1E1A17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" style="">
      <tspan x="195" dy="0">User</tspan>
    </text>
    
    
    <g filter="url(#shadow)">
      <rect x="320" y="300" width="180" height="120" rx="26" fill="#FFFDF9" stroke="#D8CDBE" stroke-width="2"/>
    </g>
    
    <text x="410" y="370" text-anchor="middle" fill="#1E1A17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" style="">
      <tspan x="410" dy="0">LLM</tspan>
    </text>
    
    
    <g filter="url(#shadow)">
      <rect x="610" y="300" width="240" height="120" rx="26" fill="#fff8f1" stroke="#E07A1F" stroke-width="4"/>
    </g>
    
    <text x="730" y="370" text-anchor="middle" fill="#1E1A17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" style="">
      <tspan x="730" dy="0">Tool</tspan>
    </text>
    <rect x="610" y="300" width="240" height="120" rx="26" fill="none" stroke="#E07A1F" stroke-width="4"/>
    
    <g filter="url(#shadow)">
      <rect x="924" y="292" width="360" height="136" rx="26" fill="#FFFDF9" stroke="#D8CDBE" stroke-width="2"/>
    </g>
    
    <text x="1104" y="370" text-anchor="middle" fill="#1E1A17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" style="">
      <tspan x="1104" dy="0">Enterprise System</tspan>
    </text>
    

    <rect x="660" y="468" width="160" height="46" rx="23" fill="#F8E0C7" stroke="#E07A1F" stroke-width="2"/>
    
    <text x="740" y="497" text-anchor="middle" fill="#E07A1F" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" style="">
      <tspan x="740" dy="0">Runtime Risk</tspan>
    </text>
    <path d="M 730 420 L 730 460" stroke="#E07A1F" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowAccent)"/>

    
    <text x="740" y="560" text-anchor="middle" fill="#E07A1F" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" style="">
      <tspan x="740" dy="0">Tool Boundary = Runtime Risk</tspan>
    </text>
    
    <text x="740" y="585.97" text-anchor="middle" fill="#685F54" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="500" style="">
      <tspan x="740" dy="0">The control problem starts when the model can</tspan><tspan x="740" dy="28.06">act through tools.</tspan>
    </text>
  
  
    <rect x="80" y="800" width="1440" height="1" fill="#D8CDBE"/>
    
    <text x="800" y="842" text-anchor="middle" fill="#685F54" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="29" font-weight="500" style="">
      <tspan x="800" dy="0">Agentic risk emerges when the model can invoke tools.</tspan>
    </text>
</svg>