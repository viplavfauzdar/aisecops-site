    <rect x="80" y="800" width="1440" height="1" fill="#D8CDBE"/>
    
    <text x="800" y="842" text-anchor="middle" fill="#685F54" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="29" font-weight="500" style="">
