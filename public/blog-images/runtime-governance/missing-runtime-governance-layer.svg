    </text>
    <rect x="660" y="118" width="280" height="8" rx="4" fill="#E07A1F"/>
  
    <rect x="70" y="160" width="1460" height="600" rx="34" fill="#FFFDF9" stroke="#D8CDBE" stroke-width="2" filter="url(#shadow)"/>
    <line x1="260" y1="360" x2="286" y2="360" stroke="#D8CDBE" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <line x1="450" y1="360" x2="468" y2="360" stroke="#D8CDBE" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <line x1="698" y1="360" x2="698" y2="360" stroke="#E07A1F" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowAccent)"/>
    <line x1="1036" y1="360" x2="1082" y2="360" stroke="#D8CDBE" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <line x1="1262" y1="360" x2="1294" y2="360" stroke="#D8CDBE" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

    
    <g filter="url(#shadow)">
      <rect x="110" y="300" width="150" height="120" rx="26" fill="#FFFDF9" stroke="#D8CDBE" stroke-width="2"/>
    </g>
    
    <text x="185" y="370" text-anchor="middle" fill="#1E1A17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" style="">
