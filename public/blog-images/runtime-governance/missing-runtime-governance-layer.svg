  </defs>
  <rect width="1600" height="900" fill="#F6F1E8"/>
  
    
    <text x="800" y="50.62" text-anchor="middle" fill="#1E1A17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" style="">
