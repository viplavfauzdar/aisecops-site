    </text>
    

    <rect x="760" y="462" width="176" height="46" rx="23" fill="#F8E0C7" stroke="#E07A1F" stroke-width="2"/>
    
    <text x="848" y="491" text-anchor="middle" fill="#E07A1F" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" style="">
