    </text>
    <path d="M 848 428 L 848 458" stroke="#E07A1F" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowAccent)"/>

    
    <text x="848" y="560" text-anchor="middle" fill="#E07A1F" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" style="">
